# Checks the skills' structure, manifests, links and public-safety guards, runs the mpn.py tests on the three
# operating systems on the oldest and newest Python supported, and enforces the size budget.
name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  structure:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest became 26.04 on 2026-10-28, which has no Python 3.9 build; 24.04 keeps the 3.9 floor tested.
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python: ["3.9", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: skills, companions, manifests, links and text guards
        run: python tests/check_skills.py
      - name: mpn.py tests
        run: python tests/test_mpn.py
      - name: decomp.py tests
        run: python tests/test_decomp.py
  budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: size budget (red fails)
        run: python scripts/budget.py
  director-freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: F10 and character-switch freeze regressions
        run: dotnet run --project tests/DirectorFreezeChecks/DirectorFreezeChecks.csproj
